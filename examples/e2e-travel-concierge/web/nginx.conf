server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the static scenario UI, and reverse-proxy the agent's public API so
    # the browser makes same-origin calls (no CORS). ${AGENT_UPSTREAM} is
    # substituted at container start by the official nginx image's envsubst
    # templates step. None of these routes returns key, VC or VP material.
    location ~ ^/(health|personas|services|users|chat|call-tool|onboard-agent|revoke-agent|deactivate-agent|delegate-agent|delegation-demo-agents|consent|grants|revoke-grant|attack/[a-z-]+)$ {
        proxy_pass http://${AGENT_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
