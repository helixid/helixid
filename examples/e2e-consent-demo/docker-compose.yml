# examples/e2e-consent-demo — two independent Service Providers, one agent, and
# a user's consent given on HelixID's consent page that survives to the second
# booking (KYA-OS story L3-H).
#
#   cp .env.example .env
#   docker compose up --build
#
# Needs the KYA-OS releases of @helixid/core, @helixid/sdk-js (1.0) and
# @helixid/mcp-middleware (1.0): see README.md.
#
# Then open:
#   Agent           : http://localhost:4100   (traveler / demo123)
#   Console (audit) : http://localhost:8080   (admin / admin)
#
# Reset everything (fresh keys + DB):  docker compose down -v
#
# Startup order: helix-api -> seed -> sp-airline + sp-hotel -> agent
name: helixid-consent-demo

# The SPs and the agent share helix-api's network namespace: did:web DIDs
# hosted by HelixID encode localhost:3000, which then resolves to the API
# inside the stack exactly as it does from the browser.
x-node-service: &node-service
  build:
    context: ../..
    dockerfile: examples/e2e-consent-demo/docker/node.Dockerfile
  restart: unless-stopped
  working_dir: /repo/examples/e2e-consent-demo
  network_mode: "service:helix-api"

x-node-env: &node-env
  HELIX_API_URL: http://localhost:3000
  HELIX_ADMIN_API_KEY: ${HELIX_ADMIN_API_KEY:-dev-admin-key-change-in-production}
  WALLETS_DIR: /wallets
  DEMO_HOST: localhost
  CONSENT_WINDOW_SECONDS: ${CONSENT_WINDOW_SECONDS:-2592000}
  CONSENT_HOP_LIFETIME_SECONDS: ${CONSENT_HOP_LIFETIME_SECONDS:-3600}

services:
  # ── HelixID API: hosts the DID documents, issues the agent's identity and
  # attestations, and serves the consent page where the user's key signs.
  helix-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    # The node services below use this network: their ports are published here.
    ports:
      - "3000:3000"
      - "4100:4100"
      - "4101:4101"
      - "4102:4102"
    environment:
      NODE_ENV: development
      PORT: "3000"
      HELIX_STORAGE_ADAPTER: sqlite
      HELIX_SQLITE_PATH: /app/data/helixid.sqlite
      API_BASE_URL: http://localhost:3000
      DID_METHOD: web
      DID_DOMAIN: localhost:3000
      HELIX_SIGNING_KEY: 11deb8f4b8f2e1c0a9d7c6b5a4938271605f4e3d2c1b0a998877665544332211
      HELIX_ADMIN_API_KEY: ${HELIX_ADMIN_API_KEY:-dev-admin-key-change-in-production}
      AUDIT_LOG_DESTINATION: both
    volumes:
      - helix_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  console:
    build:
      context: ./docker
      dockerfile: console.Dockerfile
    ports:
      - "8080:80"
    environment:
      API_BASE_URL: http://localhost:8080
      ADMIN_API_KEY: ${HELIX_ADMIN_API_KEY:-dev-admin-key-change-in-production}
      CONSOLE_USERNAME: admin
      CONSOLE_PASSWORD: admin
    depends_on:
      helix-api:
        condition: service_healthy

  # ── Run-once: enrolls both SPs and the agent (self custody: each key is generated here).
  seed:
    <<: *node-service
    restart: "no"
    command: ["pnpm", "run", "setup"]
    environment:
      <<: *node-env
      CONSOLE_URL: http://localhost:8080
    volumes:
      - wallets:/wallets
    depends_on:
      helix-api:
        condition: service_healthy

  sp-airline:
    <<: *node-service
    command: ["pnpm", "run", "sp:airline"]
    environment:
      <<: *node-env
      AIRLINE_PORT: "4101"
    volumes:
      - wallets:/wallets
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4101/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      seed:
        condition: service_completed_successfully

  sp-hotel:
    <<: *node-service
    command: ["pnpm", "run", "sp:hotel"]
    environment:
      <<: *node-env
      HOTEL_PORT: "4102"
    volumes:
      - wallets:/wallets
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4102/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      seed:
        condition: service_completed_successfully

  agent:
    <<: *node-service
    command: ["pnpm", "run", "agent"]
    environment:
      <<: *node-env
      AGENT_PORT: "4100"
      AIRLINE_URL: http://localhost:4101
      HOTEL_URL: http://localhost:4102
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - wallets:/wallets
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      sp-airline:
        condition: service_healthy
      sp-hotel:
        condition: service_healthy

volumes:
  helix_data:
  wallets:
