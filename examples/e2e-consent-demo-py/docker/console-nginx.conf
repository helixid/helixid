# Overrides the Console image's default server block for the demo.
#
# The HelixID API ships without CORS, and the Console makes its API calls from
# the browser. To keep those calls same-origin (so the audit view actually
# loads), this config serves the pre-built Console SPA and reverse-proxies
# /v1/* and /health to the helix-api container. The demo sets the Console's
# API_BASE_URL to its own origin (http://localhost:8080) so every call lands
# here first and is proxied on.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the runtime-generated config.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    location /v1/ {
        proxy_pass http://helix-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://helix-api:3000/health;
    }

    # SPA fallback for client-side routes (/agents, /audit, /enroll, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
