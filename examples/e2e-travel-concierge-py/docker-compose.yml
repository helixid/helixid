# examples/e2e-travel-concierge-py -- Python-SDK (helix-sdk-py) port of
# examples/e2e-travel-concierge. Same trust flow, same route contracts --
# only the agent and the mcp-server are reimplemented, since those are the
# services that actually call the SDK (@helixid/sdk-js + @modelcontextprotocol/sdk
# there, helix-sdk-py + the official `mcp` package here). web/, helixid-setup,
# helix-api, and Console stay unchanged JS/TS -- reused directly from
# ../e2e-travel-concierge, not copied.
#
#   cp .env.example .env      # then put your LLM_API_KEY in it
#   docker compose up --build
#
# Then open:
#   Web (agent chat): http://localhost:8091
#   Console (audit):  http://localhost:8082   (login admin / admin)
#
# Reset everything (fresh wallet + DB):  docker compose down -v
#
# Ports are offset from e2e-travel-concierge's (3000/8080/7100/4000/8090) so
# both can run side by side for comparison.
name: helixid-travel-concierge-py

x-python-service: &python-service
  build:
    context: ../..
    dockerfile: examples/e2e-travel-concierge-py/docker/python.Dockerfile
  restart: unless-stopped
  working_dir: /repo/examples/e2e-travel-concierge-py

services:
  # ── HelixID API ──────────────────────────────────────────────────────────
  helix-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      HELIX_STORAGE_ADAPTER: sqlite
      HELIX_SQLITE_PATH: /app/data/helixid.sqlite
      API_BASE_URL: http://helix-api:3000
      DID_METHOD: key
      HELIX_ISSUER_DID: did:key:z6MkgHKqmKyCQroyo3RVx3gM1LXwUNwzZkynmsqwhYNqNjdn
      HELIX_SIGNING_KEY: 11deb8f4b8f2e1c0a9d7c6b5a4938271605f4e3d2c1b0a998877665544332211
      HELIX_ADMIN_API_KEY: ${HELIX_ADMIN_API_KEY:-dev-admin-key-change-in-production}
      AUDIT_LOG_DESTINATION: both
    volumes:
      - helix_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ── Console (audit UI), unchanged JS build ──────────────────────────────
  console:
    build:
      context: ./docker
      dockerfile: console.Dockerfile
    ports:
      - "8082:80"
    environment:
      API_BASE_URL: http://localhost:8082
      ADMIN_API_KEY: ${HELIX_ADMIN_API_KEY:-dev-admin-key-change-in-production}
      CONSOLE_USERNAME: admin
      CONSOLE_PASSWORD: admin
    depends_on:
      helix-api:
        condition: service_healthy
    restart: unless-stopped

  # ── Seeder (run once, then exits 0), unchanged JS build -- its wallet
  # output is byte-for-byte compatible with helix-sdk-py's wallet format, so
  # the Python agent below loads it directly. ────────────────────────────
  helixid-setup:
    build:
      context: ../..
      dockerfile: examples/e2e-travel-concierge/docker/node.Dockerfile
    restart: "no"
    command: ["pnpm", "run", "setup"]
    environment:
      # Shared with e2e-travel-concierge, whose Console is on 8080; this stack
      # publishes it on 8082, so tell the seed which URL to print.
      CONSOLE_URL: http://localhost:8082
      HELIX_API_URL: http://helix-api:3000
      HELIX_ADMIN_API_KEY: ${HELIX_ADMIN_API_KEY:-dev-admin-key-change-in-production}
      WALLETS_DIR: /wallets
      WALLET_PASSPHRASE: ${WALLET_PASSPHRASE:-demo-passphrase}
    volumes:
      - wallets:/wallets
    depends_on:
      helix-api:
        condition: service_healthy

  # ── MCP server (guards book_flight/search_flights with helix_mcp) ──────
  mcp-server:
    <<: *python-service
    command: ["python", "-m", "mcp_server.server"]
    ports:
      - "7101:7100"
    environment:
      HELIX_API_URL: http://helix-api:3000
      MCP_PORT: "7100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7100/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      helix-api:
        condition: service_healthy
      helixid-setup:
        condition: service_completed_successfully

  # ── Agent (LLM + MCP client) ─────────────────────────────────────────────
  agent:
    <<: *python-service
    command: ["python", "-m", "agent.server"]
    ports:
      - "4001:4000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env (Anthropic, OpenAI, Azure, or Gemini key)}
      LLM_MODEL: ${LLM_MODEL:-}
      # Only used when LLM_PROVIDER=azure:
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      HELIX_API_URL: http://helix-api:3000
      HELIX_ADMIN_API_KEY: ${HELIX_ADMIN_API_KEY:-dev-admin-key-change-in-production}
      MCP_SERVER_URL: http://mcp-server:7100/mcp
      AGENT_PORT: "4000"
      WALLETS_DIR: /wallets
      WALLET_PASSPHRASE: ${WALLET_PASSPHRASE:-demo-passphrase}
    volumes:
      - wallets:/wallets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      mcp-server:
        condition: service_healthy
      helixid-setup:
        condition: service_completed_successfully

  # ── Web chat UI, unchanged static frontend reused directly from
  # ../e2e-travel-concierge/web (same route contracts, so no copy needed). ──
  web:
    build:
      context: ../e2e-travel-concierge/web
    ports:
      - "8091:80"
    environment:
      AGENT_UPSTREAM: agent:4000
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  helix_data:
  wallets:
