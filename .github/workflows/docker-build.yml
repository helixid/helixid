name: Docker Build & Push
run-name: ${{ github.ref == 'refs/heads/main' && 'Build + push to Docker Hub' || 'Build check only (no push)' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: helixid/helixid

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Run docker/setup-qemu-action@v3
        uses: docker/setup-qemu-action@v3

      - name: Run docker/setup-buildx-action@v3
        uses: docker/setup-buildx-action@v3

      # Only log in / push on main — PR builds (github.ref is the PR's
      # merge ref there, never refs/heads/main) stay build-only.
      - name: Run docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
